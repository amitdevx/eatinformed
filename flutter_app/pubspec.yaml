name: eatinformed_mobile
publish_to: none
description: EatInformed mobile presentation, backed by the existing EatInformed API.
version: 0.1.0+1
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  camera: ^0.12.2
  image_picker: ^1.2.4
  image: ^4.13.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  flutter_web_auth_2: ^5.1.0
  crypto: ^3.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/content/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VF.ttf
          weight: 400
        - asset: assets/fonts/Nunito-VF.ttf
          weight: 500
        - asset: assets/fonts/Nunito-VF.ttf
          weight: 600
        - asset: assets/fonts/Nunito-VF.ttf
          weight: 700
        - asset: assets/fonts/Nunito-VF.ttf
          weight: 800
        - asset: assets/fonts/Nunito-VF.ttf
          weight: 900
