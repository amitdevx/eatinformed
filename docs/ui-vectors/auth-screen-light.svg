<?xml version="1.0" encoding="UTF-8"?>
<svg width="428" height="960" viewBox="0 0 428 960" xmlns="http://www.w3.org/2000/svg">
  <rect id="Background" width="428" height="960" fill="#F2F2F7" />

  <!-- Top Modal Bar -->
  <g id="Top_Bar" transform="translate(24, 36)">
    <rect width="44" height="44" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" />
    <path d="M25 16l-6 6 6 6" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Header -->
  <g id="Auth_Header" transform="translate(24, 102)">
    <rect x="0" y="0" width="30" height="30" rx="10" fill="#E8F8ED" stroke="#A7F3D0" stroke-width="1" />
    <path d="M15 7C10.5 11.5 9.5 17 15 22.5C20.5 17 19.5 11.5 15 7Z" fill="#1E8E3E" />
    <text x="40" y="21" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E8E3E" text-anchor="start" letter-spacing="-0.2">EatInformed</text>

    <text x="0" y="62" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1C1C1E" text-anchor="start" letter-spacing="-0.6">Welcome Back</text>
    <text x="0" y="86" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#48484A" text-anchor="start">Sign in to access your saved food reports and sync scans.</text>
  </g>

  <!-- Segmented Control (Sign In | Create Account) -->
  <g id="Auth_Tabs" transform="translate(24, 214)">
    <rect width="380" height="44" rx="14" fill="#F2F2F7" stroke="#E5E5EA" stroke-width="1" />
    <rect x="4" y="4" width="184" height="36" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" />
    <text x="96" y="26" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1C1C1E" text-anchor="middle">Sign In</text>
    <text x="284" y="26" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#48484A" text-anchor="middle">Create Account</text>
  </g>

  <!-- Auth Form Card -->
  <g id="Card_Auth_Form" transform="translate(24, 276)">
    <rect width="380" height="390" rx="20" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1" />
    <g transform="translate(20, 24)">
      <text x="0" y="12" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#48484A" text-anchor="start" letter-spacing="0.6">EMAIL ADDRESS</text>
      <g transform="translate(0, 20)">
        <rect width="340" height="48" rx="14" fill="#F2F2F7" stroke="#E5E5EA" stroke-width="1" />
        <rect x="14" y="16" width="18" height="14" rx="2" stroke="#636366" stroke-width="1.5" fill="none" />
        <path d="M14 17l9 6 9-6" stroke="#636366" stroke-width="1.5" fill="none" />
        <text x="44" y="29" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#636366" text-anchor="start">you@example.com</text>
      </g>

      <g transform="translate(0, 86)">
        <text x="0" y="12" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#48484A" text-anchor="start" letter-spacing="0.6">PASSWORD</text>
        <g transform="translate(0, 20)">
          <rect width="340" height="48" rx="14" fill="#F2F2F7" stroke="#E5E5EA" stroke-width="1" />
          <rect x="15" y="21" width="16" height="12" rx="2" stroke="#636366" stroke-width="1.5" fill="none" />
          <path d="M18 21v-4a5 5 0 0110 0v4" stroke="#636366" stroke-width="1.5" fill="none" />
          <text x="44" y="29" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E" text-anchor="start">••••••••••••</text>
        </g>
      </g>

      <!-- Sign In Primary Button -->
      <g transform="translate(0, 174)">
        <rect width="340" height="52" rx="26" fill="#1E8E3E" />
        <text x="170" y="31" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">Sign In</text>
      </g>

      <!-- Divider -->
      <g transform="translate(0, 246)">
        <line x1="0" y1="8" x2="148" y2="8" stroke="#EBEBF0" stroke-width="1" />
        <text x="170" y="12" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#636366" text-anchor="middle" letter-spacing="0.8">OR</text>
        <line x1="192" y1="8" x2="340" y2="8" stroke="#EBEBF0" stroke-width="1" />
      </g>

      <!-- Continue as Guest Button -->
      <g transform="translate(0, 276)">
        <rect width="340" height="48" rx="24" fill="#F2F2F7" stroke="#E5E5EA" stroke-width="1" />
        <text x="170" y="29" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E" text-anchor="middle" letter-spacing="-0.2">Continue as Guest</text>
      </g>
    </g>
  </g>

  <!-- iOS Home Indicator -->
  <rect x="147" y="940" width="134" height="5" rx="2.5" fill="#1C1C1E" fill-opacity="0.22" />
</svg>