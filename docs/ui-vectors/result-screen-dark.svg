<?xml version="1.0" encoding="UTF-8"?>
<svg width="428" height="1260" viewBox="0 0 428 1260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect id="Background" width="428" height="1260" fill="#000000" />

  <!-- Top Navigation Bar -->
  <g id="Top_Navigation_Bar" transform="translate(24, 44)">
    <!-- Back Button -->
    <g id="Button_Back">
      <rect width="40" height="40" rx="12" fill="#1C1C1E" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <path d="M23 14l-6 6 6 6" stroke="#F5F5F7" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>
    <!-- Share Button -->
    <g id="Button_Share" transform="translate(340, 0)">
      <rect width="40" height="40" rx="12" fill="#1C1C1E" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <path d="M16 20h8M20 14l4 6-4 6" stroke="#F5F5F7" stroke-width="1.8" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Product Title Header -->
  <g id="Product_Header" transform="translate(24, 104)">
    <text x="0" y="14" font-size="12" font-weight="700" fill="#30D158" letter-spacing="1.2">CHOBANI</text>
    <text x="0" y="44" font-size="26" font-weight="800" fill="#F5F5F7" letter-spacing="-0.5">Plain Greek Yogurt</text>
    <text x="0" y="66" font-size="13" font-weight="400" fill="#86868B">0% Milkfat Non-Fat (170g Container)</text>
  </g>

  <!-- Summary Health Rating Card -->
  <g id="Card_Health_Summary" transform="translate(24, 190)">
    <rect width="380" height="136" rx="20" fill="#161618" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <g transform="translate(20, 20)">
      <!-- Health Rating Column -->
      <text x="0" y="12" font-size="11" font-weight="600" fill="#86868B" text-transform="uppercase">Health Rating</text>
      <!-- Score Pill -->
      <g transform="translate(0, 20)">
        <rect width="90" height="30" rx="8" fill="#1C1C1E" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="45" y="20" font-size="15" font-weight="700" fill="#30D158" text-anchor="middle">4.8 / 5.0</text>
      </g>
      <!-- Stars row -->
      <g transform="translate(100, 26)">
        <circle cx="6" cy="6" r="5" fill="#EAB308" />
        <circle cx="20" cy="6" r="5" fill="#EAB308" />
        <circle cx="34" cy="6" r="5" fill="#EAB308" />
        <circle cx="48" cy="6" r="5" fill="#EAB308" />
        <circle cx="62" cy="6" r="5" fill="#EAB308" fill-opacity="0.3" />
      </g>

      <!-- NOVA Badge Column -->
      <g transform="translate(180, 0)">
        <rect width="160" height="26" rx="13" fill="rgba(48, 209, 88, 0.15)" stroke="rgba(48, 209, 88, 0.3)" stroke-width="1" />
        <circle cx="12" cy="13" r="4" fill="#30D158" />
        <text x="22" y="17" font-size="10" font-weight="700" fill="#30D158">NOVA 1: Whole Food</text>
      </g>

      <!-- Bottom Explanation Divider -->
      <line x1="0" y1="64" x2="340" y2="64" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="0" y="86" font-size="11" font-weight="400" fill="#86868B">
        Unprocessed or minimally processed food. Clean whole food source.
      </text>
    </g>
  </g>

  <!-- Segmented Tab Switcher (Overview / Ingredients / Nutrition) -->
  <g id="Segmented_Tabs" transform="translate(24, 344)">
    <rect width="380" height="44" rx="14" fill="#1C1C1E" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <!-- Active Tab Indicator: Overview -->
    <rect x="4" y="4" width="120" height="36" rx="10" fill="#2C2C2E" />
    <text x="64" y="26" font-size="12" font-weight="600" fill="#F5F5F7" text-anchor="middle">Overview</text>
    <!-- Ingredients Tab -->
    <text x="190" y="26" font-size="12" font-weight="500" fill="#86868B" text-anchor="middle">Ingredients (2)</text>
    <!-- Nutrition Tab -->
    <text x="316" y="26" font-size="12" font-weight="500" fill="#86868B" text-anchor="middle">Nutrition Facts</text>
  </g>

  <!-- Section 1: Health Benefits / Pros -->
  <g id="Card_Benefits" transform="translate(24, 404)">
    <rect width="380" height="150" rx="20" fill="#161618" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <g transform="translate(20, 20)">
      <text x="0" y="14" font-size="14" font-weight="600" fill="#F5F5F7">Health Benefits</text>
      
      <!-- Bullet 1 -->
      <g transform="translate(0, 30)">
        <circle cx="8" cy="8" r="8" fill="rgba(48, 209, 88, 0.15)" />
        <path d="M5 8l2 2 4-4" stroke="#30D158" stroke-width="1.8" stroke-linecap="round" fill="none" />
        <text x="24" y="12" font-size="12" font-weight="400" fill="#F5F5F7">High-quality protein density (17g per serving)</text>
      </g>
      <!-- Bullet 2 -->
      <g transform="translate(0, 60)">
        <circle cx="8" cy="8" r="8" fill="rgba(48, 209, 88, 0.15)" />
        <path d="M5 8l2 2 4-4" stroke="#30D158" stroke-width="1.8" stroke-linecap="round" fill="none" />
        <text x="24" y="12" font-size="12" font-weight="400" fill="#F5F5F7">Active probiotic live cultures support gut microbiome</text>
      </g>
      <!-- Bullet 3 -->
      <g transform="translate(0, 90)">
        <circle cx="8" cy="8" r="8" fill="rgba(48, 209, 88, 0.15)" />
        <path d="M5 8l2 2 4-4" stroke="#30D158" stroke-width="1.8" stroke-linecap="round" fill="none" />
        <text x="24" y="12" font-size="12" font-weight="400" fill="#F5F5F7">Zero added sugars, zero saturated fat, low sodium</text>
      </g>
    </g>
  </g>

  <!-- Section 2: Dietary & Allergen Profile -->
  <g id="Card_Dietary" transform="translate(24, 570)">
    <rect width="380" height="136" rx="20" fill="#161618" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <g transform="translate(20, 20)">
      <text x="0" y="14" font-size="14" font-weight="600" fill="#F5F5F7">Dietary Profile &amp; Allergens</text>
      
      <!-- Pills row -->
      <g transform="translate(0, 28)">
        <rect width="84" height="26" rx="13" fill="rgba(48, 209, 88, 0.15)" stroke="rgba(48, 209, 88, 0.3)" stroke-width="1" />
        <text x="42" y="17" font-size="11" font-weight="600" fill="#30D158" text-anchor="middle">Vegetarian</text>

        <g transform="translate(92, 0)">
          <rect width="90" height="26" rx="13" fill="rgba(10, 132, 255, 0.15)" stroke="rgba(10, 132, 255, 0.3)" stroke-width="1" />
          <text x="45" y="17" font-size="11" font-weight="600" fill="#0A84FF" text-anchor="middle">Gluten-Free</text>
        </g>

        <g transform="translate(190, 0)">
          <rect width="96" height="26" rx="13" fill="rgba(255, 69, 58, 0.15)" stroke="rgba(255, 69, 58, 0.3)" stroke-width="1" />
          <text x="48" y="17" font-size="11" font-weight="600" fill="#FF453A" text-anchor="middle">Milk / Dairy</text>
        </g>
      </g>

      <line x1="0" y1="68" x2="340" y2="68" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="0" y="88" font-size="11" font-weight="400" fill="#86868B">
        Nutrient-dense clean staple suitable for vegetarian and gluten-free diets.
      </text>
    </g>
  </g>

  <!-- Section 3: Nutritional Panel Table Preview -->
  <g id="Card_Nutrition_Table" transform="translate(24, 722)">
    <rect width="380" height="280" rx="20" fill="#161618" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <g transform="translate(20, 20)">
      <text x="0" y="14" font-size="14" font-weight="600" fill="#F5F5F7">Nutritional Panel</text>
      <text x="0" y="32" font-size="11" font-weight="400" fill="#86868B">Serving Size: 1 Container (170g)</text>

      <!-- Table Header -->
      <g transform="translate(0, 48)">
        <rect width="340" height="26" rx="6" fill="#1C1C1E" />
        <text x="12" y="17" font-size="11" font-weight="600" fill="#F5F5F7">Nutrient</text>
        <text x="210" y="17" font-size="11" font-weight="600" fill="#F5F5F7" text-anchor="end">Per Serve</text>
        <text x="328" y="17" font-size="11" font-weight="600" fill="#F5F5F7" text-anchor="end">Per 100g</text>
      </g>

      <!-- Table Rows -->
      <!-- Row 1 -->
      <g transform="translate(0, 84)">
        <text x="12" y="14" font-size="12" font-weight="500" fill="#F5F5F7">Calories</text>
        <text x="210" y="14" font-size="12" font-weight="400" fill="#86868B" text-anchor="end">100 kcal</text>
        <text x="328" y="14" font-size="12" font-weight="400" fill="#86868B" text-anchor="end">59 kcal</text>
        <line x1="0" y1="24" x2="340" y2="24" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      </g>
      <!-- Row 2 -->
      <g transform="translate(0, 116)">
        <text x="12" y="14" font-size="12" font-weight="500" fill="#F5F5F7">Total Fat</text>
        <text x="210" y="14" font-size="12" font-weight="400" fill="#86868B" text-anchor="end">0g</text>
        <text x="328" y="14" font-size="12" font-weight="400" fill="#86868B" text-anchor="end">0g</text>
        <line x1="0" y1="24" x2="340" y2="24" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      </g>
      <!-- Row 3 -->
      <g transform="translate(0, 148)">
        <text x="12" y="14" font-size="12" font-weight="500" fill="#F5F5F7">Sodium</text>
        <text x="210" y="14" font-size="12" font-weight="400" fill="#86868B" text-anchor="end">65mg</text>
        <text x="328" y="14" font-size="12" font-weight="400" fill="#86868B" text-anchor="end">38mg</text>
        <line x1="0" y1="24" x2="340" y2="24" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      </g>
      <!-- Row 4 -->
      <g transform="translate(0, 180)">
        <text x="12" y="14" font-size="12" font-weight="500" fill="#F5F5F7">Protein</text>
        <text x="210" y="14" font-size="12" font-weight="700" fill="#30D158" text-anchor="end">17g</text>
        <text x="328" y="14" font-size="12" font-weight="700" fill="#30D158" text-anchor="end">10g</text>
        <line x1="0" y1="24" x2="340" y2="24" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      </g>
      <!-- Row 5 -->
      <g transform="translate(0, 212)">
        <text x="12" y="14" font-size="12" font-weight="500" fill="#F5F5F7">Total Sugars</text>
        <text x="210" y="14" font-size="12" font-weight="400" fill="#86868B" text-anchor="end">4g</text>
        <text x="328" y="14" font-size="12" font-weight="400" fill="#86868B" text-anchor="end">2.4g</text>
      </g>
    </g>
  </g>

  <!-- Bottom CTA Button -->
  <g id="Button_Scan_Another" transform="translate(24, 1020)">
    <rect width="380" height="52" rx="26" fill="#30D158" />
    <text x="190" y="31" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">Scan Another Label</text>
  </g>

  <!-- Bottom Tab Bar -->
  
  <g id="Navigation_Bottom_Tab_Bar" transform="translate(0, 830)">
    <!-- Tab Bar Surface -->
    <rect width="428" height="84" fill="#161618" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <g id="Tab_Home">
      <!-- Icon indicator -->
      <circle cx="43" cy="22" r="8" fill="#6E6E73" fill-opacity="0.4" />
      <text x="43" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6E6E73" text-anchor="middle">Home</text>
    </g>

    <g id="Tab_Scan" transform="translate(106, 10)">
      <circle cx="22" cy="22" r="22" fill="#30D158" />
      <!-- Scan Viewfinder Icon -->
      <path d="M14 16h4M14 16v4M30 16h-4M30 16v4M14 28h4M14 28v-4M30 28h-4M30 28v-4" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none" />
      <line x1="12" y1="22" x2="32" y2="22" stroke="#000000" stroke-width="2" stroke-linecap="round" />
    </g>

    <g id="Tab_History">
      <!-- Icon indicator -->
      <circle cx="214" cy="22" r="8" fill="#6E6E73" fill-opacity="0.4" />
      <text x="214" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6E6E73" text-anchor="middle">History</text>
    </g>

    <g id="Tab_Guide">
      <!-- Icon indicator -->
      <circle cx="300" cy="22" r="8" fill="#6E6E73" fill-opacity="0.4" />
      <text x="300" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6E6E73" text-anchor="middle">Guide</text>
    </g>

    <g id="Tab_Profile">
      <!-- Icon indicator -->
      <circle cx="385" cy="22" r="8" fill="#6E6E73" fill-opacity="0.4" />
      <text x="385" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#6E6E73" text-anchor="middle">Profile</text>
    </g>
  </g>

</svg>
