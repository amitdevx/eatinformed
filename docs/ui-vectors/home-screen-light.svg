<?xml version="1.0" encoding="UTF-8"?>
<svg width="428" height="1040" viewBox="0 0 428 1040" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect id="Background" width="428" height="1040" fill="#F5F5F7" />

  <!-- App Header Section -->
  <g id="Header" transform="translate(24, 40)">
    <!-- Top Branding Row -->
    <g id="Brand_Row">
      <!-- Leaf Logo Icon -->
      <circle cx="12" cy="12" r="12" fill="rgba(52, 199, 89, 0.12)" />
      <path d="M12 4C7 9 6 15 12 21C18 15 17 9 12 4Z" fill="#34C759" />
      <circle cx="10" cy="11" r="4" stroke="#1D1D1F" stroke-width="1.5" fill="none" />
      <line x1="13" y1="14" x2="17" y2="18" stroke="#1D1D1F" stroke-width="1.5" stroke-linecap="round" />
      <text x="32" y="17" font-size="16" font-weight="700" fill="#1D1D1F" letter-spacing="-0.3">EatInformed</text>
      
      <!-- Theme Toggle Pill Button -->
      <g id="Theme_Toggle" transform="translate(344, 0)">
        <rect width="36" height="36" rx="18" fill="#E5E5EA" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
        <circle cx="18" cy="18" r="6" fill="#1D1D1F" />
      </g>
    </g>

    <!-- Hero Title & Copy -->
    <g id="Hero_Titles" transform="translate(0, 52)">
      <text x="0" y="32" font-size="34" font-weight="800" fill="#1D1D1F" letter-spacing="-0.8">Food clarity.</text>
      <text x="0" y="70" font-size="34" font-weight="800" fill="#86868B" letter-spacing="-0.8">For what you eat.</text>
      <text x="0" y="104" font-size="13" font-weight="400" fill="#86868B" width="380">
        <tspan x="0" dy="0">Scan any ingredient list or nutrition panel for instant</tspan>
        <tspan x="0" dy="18">NOVA food processing groups and health scores.</tspan>
      </text>
    </g>
  </g>

  <!-- Section 1: Main CTA Card -->
  <g id="Card_Quick_Scan" transform="translate(24, 215)">
    <rect width="380" height="186" rx="20" fill="#FFFFFF" stroke="rgba(52, 199, 89, 0.3)" stroke-width="1.5" />
    
    <g transform="translate(20, 20)">
      <circle cx="20" cy="20" r="20" fill="rgba(52, 199, 89, 0.12)" />
      <path d="M14 14h3M14 14v3M26 14h-3M26 14v3M14 26h3M14 26v-3M26 26h-3M26 26v-3" stroke="#34C759" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <line x1="12" y1="20" x2="28" y2="20" stroke="#34C759" stroke-width="1.8" stroke-linecap="round" />
      
      <text x="52" y="17" font-size="16" font-weight="600" fill="#1D1D1F">Scan a Product Label</text>
      <text x="52" y="34" font-size="12" font-weight="400" fill="#86868B">Camera capture or photo library upload</text>
    </g>

    <!-- Scan Button -->
    <g id="Button_Scan" transform="translate(20, 78)">
      <rect width="340" height="48" rx="24" fill="#34C759" />
      <text x="170" y="29" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Scan Food Label</text>
    </g>

    <!-- Quick Navigation Row -->
    <g id="Quick_Nav_Row" transform="translate(20, 136)">
      <!-- History Button -->
      <g id="Quick_History">
        <rect width="106" height="34" rx="10" fill="#E5E5EA" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
        <text x="53" y="21" font-size="11" font-weight="500" fill="#86868B" text-anchor="middle">History</text>
      </g>
      <!-- NOVA Guide Button -->
      <g id="Quick_Guide" transform="translate(117, 0)">
        <rect width="106" height="34" rx="10" fill="#E5E5EA" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
        <text x="53" y="21" font-size="11" font-weight="500" fill="#86868B" text-anchor="middle">NOVA Guide</text>
      </g>
      <!-- Account Button -->
      <g id="Quick_Account" transform="translate(234, 0)">
        <rect width="106" height="34" rx="10" fill="#E5E5EA" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
        <text x="53" y="21" font-size="11" font-weight="500" fill="#86868B" text-anchor="middle">Account</text>
      </g>
    </g>
  </g>

  <!-- Section 2: Sample Products Header -->
  <g id="Section_Samples_Header" transform="translate(24, 425)">
    <text x="0" y="16" font-size="18" font-weight="700" fill="#1D1D1F" letter-spacing="-0.3">Try Instant Samples</text>
    <text x="0" y="34" font-size="12" font-weight="400" fill="#86868B">Compare products across the food processing spectrum</text>
  </g>

  <!-- Sample Card 1: Greek Yogurt (NOVA 1) -->
  <g id="Sample_Card_Yogurt" transform="translate(24, 475)">
    <rect width="380" height="98" rx="20" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
    <text x="20" y="30" font-size="15" font-weight="600" fill="#1D1D1F">Greek Yogurt</text>
    <text x="20" y="48" font-size="12" font-weight="400" fill="#86868B">Chobani Plain Non-Fat</text>
    <!-- Arrow -->
    <path d="M350 32l5 5-5 5" stroke="#86868B" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <!-- Meta row -->
    <g transform="translate(20, 64)">
      <!-- Score pill -->
      <rect width="84" height="22" rx="6" fill="#E5E5EA" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
      <text x="42" y="15" font-size="11" font-weight="700" fill="#34C759" text-anchor="middle">4.8 / 5.0</text>
      <!-- NOVA 1 pill -->
      <g transform="translate(94, 0)">
        <rect width="154" height="22" rx="11" fill="rgba(52, 199, 89, 0.12)" stroke="rgba(52, 199, 89, 0.3)" stroke-width="1" />
        <circle cx="10" cy="11" r="3" fill="#248A3D" />
        <text x="18" y="15" font-size="10" font-weight="700" fill="#248A3D">NOVA 1: Whole Food</text>
      </g>
    </g>
  </g>

  <!-- Sample Card 2: Granola (NOVA 3) -->
  <g id="Sample_Card_Granola" transform="translate(24, 585)">
    <rect width="380" height="98" rx="20" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
    <text x="20" y="30" font-size="15" font-weight="600" fill="#1D1D1F">Oats and Honey Granola</text>
    <text x="20" y="48" font-size="12" font-weight="400" fill="#86868B">KIND Healthy Grains</text>
    <path d="M350 32l5 5-5 5" stroke="#86868B" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <g transform="translate(20, 64)">
      <rect width="84" height="22" rx="6" fill="#E5E5EA" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
      <text x="42" y="15" font-size="11" font-weight="700" fill="#C97700" text-anchor="middle">3.6 / 5.0</text>
      <g transform="translate(94, 0)">
        <rect width="166" height="22" rx="11" fill="rgba(255, 149, 0, 0.12)" stroke="rgba(255, 149, 0, 0.3)" stroke-width="1" />
        <circle cx="10" cy="11" r="3" fill="#C97700" />
        <text x="18" y="15" font-size="10" font-weight="700" fill="#C97700">NOVA 3: Processed Food</text>
      </g>
    </g>
  </g>

  <!-- Sample Card 3: Potato Chips (NOVA 4) -->
  <g id="Sample_Card_Chips" transform="translate(24, 695)">
    <rect width="380" height="98" rx="20" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
    <text x="20" y="30" font-size="15" font-weight="600" fill="#1D1D1F">Classic Potato Chips</text>
    <text x="20" y="48" font-size="12" font-weight="400" fill="#86868B">Lays Classic</text>
    <path d="M350 32l5 5-5 5" stroke="#86868B" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <g transform="translate(20, 64)">
      <rect width="84" height="22" rx="6" fill="#E5E5EA" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
      <text x="42" y="15" font-size="11" font-weight="700" fill="#D70015" text-anchor="middle">1.9 / 5.0</text>
      <g transform="translate(94, 0)">
        <rect width="170" height="22" rx="11" fill="rgba(255, 59, 48, 0.12)" stroke="rgba(255, 59, 48, 0.3)" stroke-width="1" />
        <circle cx="10" cy="11" r="3" fill="#D70015" />
        <text x="18" y="15" font-size="10" font-weight="700" fill="#D70015">NOVA 4: Ultra-Processed</text>
      </g>
    </g>
  </g>

  <!-- Section 3: Educational NOVA Banner -->
  <g id="Card_NOVA_Banner" transform="translate(24, 805)">
    <rect width="380" height="96" rx="20" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
    <g transform="translate(18, 18)">
      <rect width="36" height="36" rx="10" fill="#E5E5EA" />
      <path d="M12 14h12v10H12z" stroke="#007AFF" stroke-width="1.8" fill="none" />
      <text x="48" y="16" font-size="14" font-weight="600" fill="#1D1D1F">The NOVA Standard</text>
      <text x="48" y="34" font-size="11" font-weight="400" fill="#86868B">
        <tspan x="48" dy="0">International benchmark classifying foods by the</tspan>
        <tspan x="48" dy="16">extent and purpose of industrial processing.</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Navigation Bar (Fixed in Viewport) -->
  
  <g id="Navigation_Bottom_Tab_Bar" transform="translate(0, 830)">
    <!-- Tab Bar Surface -->
    <rect width="428" height="84" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />

    <g id="Tab_Home">
      <!-- Icon indicator -->
      <circle cx="43" cy="22" r="8" fill="#34C759" fill-opacity="1.0" />
      <text x="43" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#34C759" text-anchor="middle">Home</text>
    </g>

    <g id="Tab_Scan" transform="translate(106, 10)">
      <circle cx="22" cy="22" r="22" fill="#34C759" />
      <!-- Scan Viewfinder Icon -->
      <path d="M14 16h4M14 16v4M30 16h-4M30 16v4M14 28h4M14 28v-4M30 28h-4M30 28v-4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
      <line x1="12" y1="22" x2="32" y2="22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <g id="Tab_History">
      <!-- Icon indicator -->
      <circle cx="214" cy="22" r="8" fill="#86868B" fill-opacity="0.4" />
      <text x="214" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#86868B" text-anchor="middle">History</text>
    </g>

    <g id="Tab_Guide">
      <!-- Icon indicator -->
      <circle cx="300" cy="22" r="8" fill="#86868B" fill-opacity="0.4" />
      <text x="300" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#86868B" text-anchor="middle">Guide</text>
    </g>

    <g id="Tab_Profile">
      <!-- Icon indicator -->
      <circle cx="385" cy="22" r="8" fill="#86868B" fill-opacity="0.4" />
      <text x="385" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#86868B" text-anchor="middle">Profile</text>
    </g>
  </g>

</svg>
