<?xml version="1.0" encoding="UTF-8"?>
<svg width="428" height="1180" viewBox="0 0 428 1180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect id="Background" width="428" height="1180" fill="#F5F5F7" />

  <!-- Header -->
  <g id="Header" transform="translate(24, 44)">
    <text x="0" y="24" font-size="28" font-weight="800" fill="#1D1D1F" letter-spacing="-0.5">Food Safety Guide</text>
    <text x="0" y="50" font-size="13" font-weight="400" fill="#86868B">
      Understand food processing, chemical additives, and health impacts.
    </text>
  </g>

  <!-- NOVA Scale Description -->
  <g id="NOVA_Intro" transform="translate(24, 120)">
    <text x="0" y="16" font-size="18" font-weight="700" fill="#1D1D1F">The NOVA Classification</text>
    <text x="0" y="34" font-size="12" font-weight="400" fill="#86868B">
      Developed at the University of Sao Paulo, NOVA categorizes all foods by degree of processing.
    </text>
  </g>

  <!-- NOVA 1 Card -->
  <g id="Card_NOVA_1" transform="translate(24, 175)">
    <rect width="380" height="150" rx="20" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
    <g transform="translate(20, 20)">
      <rect width="160" height="24" rx="12" fill="rgba(52, 199, 89, 0.12)" stroke="rgba(52, 199, 89, 0.3)" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#248A3D" />
      <text x="22" y="16" font-size="11" font-weight="700" fill="#248A3D">Group 1: Whole Foods</text>
      <text x="0" y="44" font-size="13" font-weight="600" fill="#1D1D1F">Unprocessed or Minimally Processed</text>
      <text x="0" y="64" font-size="11" font-weight="400" fill="#86868B">
        Whole grains, rolled oats, fresh fruits, vegetables, plain milk, eggs, and raw seeds.
      </text>
      <text x="0" y="96" font-size="11" font-weight="600" fill="#34C759">
        Impact: Optimal nutrient density and highest health rating.
      </text>
    </g>
  </g>

  <!-- NOVA 2 Card -->
  <g id="Card_NOVA_2" transform="translate(24, 340)">
    <rect width="380" height="150" rx="20" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
    <g transform="translate(20, 20)">
      <rect width="170" height="24" rx="12" fill="rgba(0, 122, 255, 0.12)" stroke="rgba(0, 122, 255, 0.3)" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#007AFF" />
      <text x="22" y="16" font-size="11" font-weight="700" fill="#007AFF">Group 2: Culinary Bases</text>
      <text x="0" y="44" font-size="13" font-weight="600" fill="#1D1D1F">Processed Culinary Ingredients</text>
      <text x="0" y="64" font-size="11" font-weight="400" fill="#86868B">
        Substances derived from nature: olive oil, butter, table sugar, and sea salt.
      </text>
      <text x="0" y="96" font-size="11" font-weight="600" fill="#007AFF">
        Impact: Safe when used in balanced home cooking.
      </text>
    </g>
  </g>

  <!-- NOVA 3 Card -->
  <g id="Card_NOVA_3" transform="translate(24, 505)">
    <rect width="380" height="150" rx="20" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
    <g transform="translate(20, 20)">
      <rect width="176" height="24" rx="12" fill="rgba(255, 149, 0, 0.12)" stroke="rgba(255, 149, 0, 0.3)" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#C97700" />
      <text x="22" y="16" font-size="11" font-weight="700" fill="#C97700">Group 3: Processed Foods</text>
      <text x="0" y="44" font-size="13" font-weight="600" fill="#1D1D1F">Simple Processed Formulations</text>
      <text x="0" y="64" font-size="11" font-weight="400" fill="#86868B">
        Foods made by adding salt, sugar, or oil to whole foods (e.g. canned beans, cheeses).
      </text>
      <text x="0" y="96" font-size="11" font-weight="600" fill="#C97700">
        Impact: Balanced; monitor sodium and added sugar totals.
      </text>
    </g>
  </g>

  <!-- NOVA 4 Card -->
  <g id="Card_NOVA_4" transform="translate(24, 670)">
    <rect width="380" height="150" rx="20" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
    <g transform="translate(20, 20)">
      <rect width="190" height="24" rx="12" fill="rgba(255, 59, 48, 0.12)" stroke="rgba(255, 59, 48, 0.3)" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#D70015" />
      <text x="22" y="16" font-size="11" font-weight="700" fill="#D70015">Group 4: Ultra-Processed</text>
      <text x="0" y="44" font-size="13" font-weight="600" fill="#1D1D1F">Ultra-Processed Foods (UPFs)</text>
      <text x="0" y="64" font-size="11" font-weight="400" fill="#86868B">
        Industrial formulations with emulsifiers, colors, artificial sweeteners, and preservatives.
      </text>
      <text x="0" y="96" font-size="11" font-weight="600" fill="#D70015">
        Impact: Linked to metabolic disruption and inflammatory risk.
      </text>
    </g>
  </g>

  <!-- Additives Section Header -->
  <g id="Section_Additives" transform="translate(24, 840)">
    <text x="0" y="16" font-size="18" font-weight="700" fill="#1D1D1F">Concerning Additives</text>
    <text x="0" y="34" font-size="12" font-weight="400" fill="#86868B">
      Industrial substances frequently flagged in packaged consumer foods.
    </text>
  </g>

  <!-- Additive Card 1: Emulsifiers -->
  <g id="Card_Emulsifiers" transform="translate(24, 890)">
    <rect width="380" height="96" rx="20" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
    <g transform="translate(20, 20)">
      <text x="0" y="14" font-size="14" font-weight="600" fill="#1D1D1F">Emulsifiers (Polysorbate 80, CMC)</text>
      <text x="0" y="34" font-size="11" font-weight="400" fill="#86868B">
        <tspan x="0" dy="0">Used to blend immiscible liquids and extend shelf life.</tspan>
        <tspan x="0" dy="16">Studies suggest high intake can thin gut mucosal barriers.</tspan>
      </text>
    </g>
  </g>

  <!-- Additive Card 2: High Fructose Corn Syrup -->
  <g id="Card_HFCS" transform="translate(24, 1000)">
    <rect width="380" height="96" rx="20" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
    <g transform="translate(20, 20)">
      <text x="0" y="14" font-size="14" font-weight="600" fill="#1D1D1F">High-Fructose Corn Syrup (HFCS)</text>
      <text x="0" y="34" font-size="11" font-weight="400" fill="#86868B">
        <tspan x="0" dy="0">Industrial liquid sweetener with rapid hepatic uptake,</tspan>
        <tspan x="0" dy="16">strongly associated with elevated triglycerides and fatty liver.</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  
  <g id="Navigation_Bottom_Tab_Bar" transform="translate(0, 830)">
    <!-- Tab Bar Surface -->
    <rect width="428" height="84" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />

    <g id="Tab_Home">
      <!-- Icon indicator -->
      <circle cx="43" cy="22" r="8" fill="#86868B" fill-opacity="0.4" />
      <text x="43" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#86868B" text-anchor="middle">Home</text>
    </g>

    <g id="Tab_Scan" transform="translate(106, 10)">
      <circle cx="22" cy="22" r="22" fill="#34C759" />
      <!-- Scan Viewfinder Icon -->
      <path d="M14 16h4M14 16v4M30 16h-4M30 16v4M14 28h4M14 28v-4M30 28h-4M30 28v-4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
      <line x1="12" y1="22" x2="32" y2="22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <g id="Tab_History">
      <!-- Icon indicator -->
      <circle cx="214" cy="22" r="8" fill="#86868B" fill-opacity="0.4" />
      <text x="214" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#86868B" text-anchor="middle">History</text>
    </g>

    <g id="Tab_Guide">
      <!-- Icon indicator -->
      <circle cx="300" cy="22" r="8" fill="#34C759" fill-opacity="1.0" />
      <text x="300" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#34C759" text-anchor="middle">Guide</text>
    </g>

    <g id="Tab_Profile">
      <!-- Icon indicator -->
      <circle cx="385" cy="22" r="8" fill="#86868B" fill-opacity="0.4" />
      <text x="385" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#86868B" text-anchor="middle">Profile</text>
    </g>
  </g>

</svg>
