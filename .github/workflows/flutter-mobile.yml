name: Flutter mobile preview

on:
  push:
    branches: ['migration/flutter-ui']
    paths: ['flutter_app/**', '.github/workflows/flutter-mobile.yml']
  pull_request:
    paths: ['flutter_app/**', '.github/workflows/flutter-mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter SDK
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git flutter-sdk
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --reporter expanded
      - name: Build side-by-side profile APK
        run: flutter build apk --profile --target-platform android-arm64,android-x64 --build-number=${{ github.run_number }}
      - name: Record artifact provenance
        run: |
          git rev-parse HEAD > build/app/outputs/flutter-apk/commit.txt
          cd build/app/outputs/flutter-apk
          sha256sum app-profile.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: eatinformed-flutter-profile-${{ github.sha }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-profile.apk
            flutter_app/build/app/outputs/flutter-apk/commit.txt
            flutter_app/build/app/outputs/flutter-apk/SHA256SUMS
          retention-days: 14
